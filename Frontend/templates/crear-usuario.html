<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear usuario | Sistema de Tickets</title>
    <link rel="stylesheet" href="../css/estilos.css">
    <script src="../js/crear-usuario.js" defer></script>
</head>

<body class="auth-page">
    <main>
        <section>
            <header style="border: none; padding: 0 0 1.5rem 0; flex-direction: column; align-items: flex-start; gap: 0.25rem;">
                <h1 style="font-size: 1.5rem;">Crear nuevo usuario</h1>
                <p style="font-size: 0.9rem; color: var(--text-muted);">Completa el formulario para registrar una cuenta.</p>
            </header>

            <form id="formulario-usuario">
                <div class="form-group">
                    <label for="cedula">Cédula</label>
                    <input type="text" id="cedula" name="cedula" minlength="8" maxlength="8" inputmode="numeric" required placeholder="Ej. 12345678">
                </div>

                <div class="form-group">
                    <label for="usuario">Nombre de usuario</label>
                    <input type="text" id="usuario" name="usuario" minlength="3" maxlength="50" autocomplete="username" required placeholder="Usuario">
                </div>

                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" name="password" minlength="6" autocomplete="new-password" required placeholder="••••••••">
                </div>

                <div class="form-group">
                    <label for="rol">Rol</label>
                    <select id="rol" name="rol" required>
                        <option value="">Selecciona un rol</option>
                        <option value="docente">Docente</option>
                        <option value="encargado">Encargado</option>
                    </select>
                </div>

                <p id="mensaje-error" role="alert" hidden></p>
                <p id="mensaje-exito" role="status" hidden></p>

                <button type="submit">Crear usuario</button>

                <div class="auth-links">
                    <a href="../index.html">← Volver al Inicio de Sesión</a>
                </div>
            </form>
        </section>
    </main>

    <footer>
        <p>Sistema institucional de gestión de incidentes</p>
    </footer>
</body>
</html>
